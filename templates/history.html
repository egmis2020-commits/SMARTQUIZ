<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>History</title></head><body><header><b>📚 Quiz History</b><nav><a href="/student">📝 Quiz</a><a href="/logout">Logout</a></nav></header><main class="container"><div class="card"><h1>My Attempts</h1>{% for r in rows %}<div class="history"><b>#{{r['attempt_number']}}</b><span><b>{{r['title']}}</b><br>{{r['completed_at']}}</span><strong>{{'%.1f'|format(r['percentage'])}}%</strong><span>{{r['correct']}} correct · {{r['incorrect']}} incorrect</span><b class="{{'pass' if r['passed'] else 'fail'}}">{{'PASS' if r['passed'] else 'FAIL'}}</b></div>{% else %}<p>No attempts yet.</p>{% endfor %}</div></main><script>async function studentHeartbeat(){try{await fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true})}catch(e){}}studentHeartbeat();setInterval(studentHeartbeat,15000);window.addEventListener('beforeunload',studentHeartbeat);</script></body></html>
