<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Teacher Security</title></head><body><header><b>👩‍🏫 Teacher Dashboard</b><nav><a href="/teacher">Dashboard</a><a href="/teacher/results">📊 Results</a><a class="active" href="/teacher/security">🔐 Security</a><a href="/logout">Logout</a></nav></header><main class="container"><div class="page-title"><div><div class="mode-badge">🔒 LOCAL LAN / OFFLINE MODE</div><h1>🔐 Security</h1><p class="muted">Teacher account: <b>{{user['full_name']}}</b> · Username: <b>{{user['username']}}</b></p></div><a href="/teacher"><button type="button" class="secondary">← Dashboard</button></a></div><section class="card security-card"><h2>Change Password</h2>{% if message %}<div class="success-box">{{message}}</div>{% endif %}{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post"><label>Current Password<input type="password" name="current_password" required></label><label>New Password<input type="password" name="new_password" minlength="6" required></label><label>Confirm New Password<input type="password" name="confirm_password" minlength="6" required></label><button>Change Password</button></form></section></main></body></html>
