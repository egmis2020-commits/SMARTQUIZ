<!doctype html><html><head><meta charset="utf-8"><title>{{ quiz['title'] }}</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><b>🎓 TLE-ICT-CSS</b><nav><span>{{ user['username'] }}</span><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('logout') }}">Logout</a><button id="themeBtn" type="button">☾</button></nav></header><div id="connectionBanner" class="connection-banner" role="status" aria-live="polite">
  <div class="connection-banner-icon">↻</div>
  <div class="connection-banner-content"><strong id="connectionTitle">Connection status</strong><span id="connectionMessage"></span></div>
  <button id="connectionAction" type="button">Resume</button>
</div><main class="quizwrap"><h1>{{ quiz['title'] }}</h1><div class="top"><span id="count"></span><strong id="timer">00:00</strong></div><div class="timerlabel" id="timerLabel">Total time remaining · {{ quiz['duration_minutes'] }} minutes</div><div class="timerlabel" id="questionTime">Question time: 0.0s</div><div class="progress"><i id="bar"></i></div><section class="quiz-navigation card"><div class="nav-title"><b>Question Navigator</b><span id="answerStatus" class="answer-status pending"></span></div><div id="questionNav" class="question-nav"></div><div class="nav-help">Green = answered · Orange = skipped · Gray = not answered. You can return to any question.</div></section><section class="card"><h2 id="question"></h2><div id="choices"></div><div class="actions"><button id="skip" class="secondary" type="button">Skip for Now</button><button id="next" disabled type="button">Next Question →</button></div></section></main><script>window.Q={{ questions|tojson }};window.QUIZ_ID={{ quiz['id']|tojson }};window.QUIZ_DURATION={{ quiz['duration_minutes']|tojson }};</script><script src="{{ url_for('static', filename='quiz.js') }}"></script><script>async function studentHeartbeat(){try{await fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true})}catch(e){}}studentHeartbeat();setInterval(studentHeartbeat,15000);window.addEventListener('beforeunload',studentHeartbeat);</script></body></html>
